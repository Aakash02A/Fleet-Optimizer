<!DOCTYPE html>
<html>
<head>
<title>Fleet Intelligence Dashboard</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
font-family: Arial;
background:#0f172a;
color:white;
text-align:center;
}

.card{
    background:#1e293b;
    padding:20px;
    margin:10px;
    border-radius:12px;
    display:inline-block;
    min-width:180px;

    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.card:hover{
    transform: translateY(-8px) scale(1.03);
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

#map{
height:400px;
margin-top:20px;
}
</style>
</head>

<body>

<h1> Fleet Intelligence System</h1>

<div class="card">
<h3>Vehicle</h3>
<p id="vid">--</p>
</div>

<div class="card">
<h3>Fuel</h3>
<p id="fuel">--</p>
</div>

<div class="card">
<h3>Status</h3>
<p id="status">--</p>
</div>

<div class="card">
<h3>Last Update</h3>
<p id="time">--</p>
</div>

<div class="card">
<h3>Efficiency</h3>
<p id="eff">-- km/l</p>
</div>

<div class="card">
<h3>Range</h3>
<p id="range">-- km</p>
</div>

<div id="map"></div>

<canvas id="chart" width="400" height="200"></canvas>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

let map = L.map('map').setView([11.27,78.16],13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let marker = L.marker([11.27,78.16]).addTo(map);

let lastStatus = "";
let lastData = null;
let lastValidData = null;
let lastLat = null;
let lastLon = null;

function updateUI(data){

    document.getElementById("vid").innerText = data.vehicle_id;

    // Fuel styling
    let fuelText = data.fuel + "%";
    if(data.fuel < 30){
        fuelText = "🔴 " + fuelText;
    } else if(data.fuel < 60){
        fuelText = "🟡 " + fuelText;
    } else{
        fuelText = "🟢 " + fuelText;
    }

    document.getElementById("fuel").innerText = fuelText;

    document.getElementById("status").innerText = data.status;
    document.getElementById("time").innerText = data.timestamp;
 // ✅ Efficiency
    document.getElementById("eff").innerText = data.efficiency + " km/l";

    // ✅ Range
    let rangeText = data.estimated_range + " km";

    if(data.estimated_range < 100){
        rangeText = "🔴 " + rangeText;
    } else if(data.estimated_range < 300){
        rangeText = "🟡 " + rangeText;
    } else{
        rangeText = "🟢 " + rangeText;
    }

    document.getElementById("range").innerText = rangeText;

    // Map update ONLY if moved
    if(
        !lastLat ||
        Math.abs(lastLat - data.latitude) > 0.0005 ||
        Math.abs(lastLon - data.longitude) > 0.0005
    ){
        marker.setLatLng([data.latitude, data.longitude]);

        map.flyTo([data.latitude, data.longitude], 13, {
            animate: true,
            duration: 1
        });

        lastLat = data.latitude;
        lastLon = data.longitude;
    }
}
async function updateData(){

    try{
        let res = await fetch("http://127.0.0.1:5000/latest");
        let data = await res.json();

        // ❌ If invalid → DON'T TOUCH UI
        if(!data || !data.vehicle_id){
            console.log("No new data, keeping old UI");
            return;
        }

        // ✅ Store valid data
        lastValidData = data;

        // ✅ Update UI ONLY with valid data
        updateUI(data);

    }catch(err){
        console.log("Server error:", err);

        // ❌ On error → DO NOTHING (keep old UI)
    }
}





// -------- CHART --------

let ctx = document.getElementById('chart').getContext('2d');

let chart = new Chart(ctx,{
type:'line',
data:{
labels:[],
datasets:[{
    label:'Fuel Level',
    data:[],
    borderWidth:3,
    tension:0.4,
    fill:true,
    backgroundColor:"rgba(56,189,248,0.2)",
    borderColor:"#38bdf8",
    pointRadius:3
}]
},
options:{
animation:{
duration:800
},
scales:{
x:{
ticks:{
maxTicksLimit:6   // prevent crowding
}
},
y:{
min:0,
max:100
}
}
}
});

function loadGraph(data){

    if(!data || data.fuel === undefined){
        return;
    }

    
    let time = new Date(data.timestamp).toLocaleTimeString();
    let lastLabel = chart.data.labels[chart.data.labels.length - 1];
    if(lastLabel === time){
        return;
    }
    chart.data.labels.push(time);
    chart.data.datasets[0].data.push(data.fuel);
     chart.update();
}



setInterval(async ()=>{
    try{
        let res = await fetch("http://127.0.0.1:5000/latest");
        let data = await res.json();

        if(!data || !data.vehicle_id){
            if(lastValidData){
                data = lastValidData;
            } else return;
        }

        lastValidData = data;

        updateUI(data);
        loadGraph(data);

    }catch(err){
        console.log("Error:", err);
    }
},3000);

// ✅ ADD HERE (very bottom)
window.onload = async ()=>{
    try{
        let res = await fetch("http://127.0.0.1:5000/history");
        let history = await res.json();

        history.forEach(d=>{
            let time = new Date(d.time).toLocaleTimeString();
            chart.data.labels.push(time);
            chart.data.datasets[0].data.push(d.fuel);
        });

        chart.update();

    }catch(err){
        console.log("History load failed");
    }
};
</script>

</body>
</html>
